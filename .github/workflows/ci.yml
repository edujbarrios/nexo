name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q python/nexo
      - run: python examples/agent_pair.py
      - run: python examples/attachments.py
      - run: python examples/handshake.py
      - run: python examples/plain_text.py
      - run: python examples/image_transfer.py
      - run: python examples/socket_session.py
      - run: python examples/stream_image_file.py
      - run: python examples/nexo64_images.py
      - run: python examples/replay_guard.py
      - run: python benchmarks/run.py
      - run: |
          printf 'Hello, agent' | python -m nexo encode-text | python -m nexo decode-text
      - run: |
          echo '{"status":"ok","task":42,"type":"result"}' | python -m nexo inspect
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p nexo-core
      - run: cargo check -p nexo-python

  native-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e ".[dev]" maturin
      - name: Build separate nexo-native wheel
        working-directory: bindings
        run: maturin build --release -o ../dist
      - run: python -m pip install dist/*.whl
      - run: python -m pip show nexo nexo-native
      - run: |
          python -c "import nexo_native; assert nexo_native.encode_text({'task': 1})"
      - run: python -m pytest -q tests/test_native.py
      - run: python benchmarks/speed.py --iterations 100 --repeats 2

  benchmark-toon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[tokens]" toon-format
      - run: python benchmarks/run.py --toon --model gpt-4o

  rust-python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e ".[dev]"
      - run: cargo build -p nexo-core --bin nexo-inspect
      - run: python -m pytest -q tests/test_cross_language.py
        env:
          NEXO_RUST_INSPECT: target/debug/nexo-inspect

  crypto-aead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,crypto]"
      - run: python -m pytest -q tests/test_nexo64.py tests/test_nexo64_crypto.py tests/test_nexo64_cli.py tests/test_replay_guard.py
      - run: python examples/replay_guard.py
      - run: python examples/nexo64_images.py
      - run: |
          python -c "from nexo import seal_nexo64, open_nexo64; key=b'k'*32; assert open_nexo64(seal_nexo64(b'image bytes', key), key) == b'image bytes'"

  distribution:
    name: Build and smoke-test PyPI artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build universal wheel and source archive
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate metadata and package contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py
      - name: Validate clean wheel installation
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --no-index --find-links dist nexo-agent-protocol==0.1.0
          .smoke-venv/bin/python -c "import nexo, importlib.metadata; assert nexo.__version__ == importlib.metadata.version('nexo-agent-protocol') == '0.1.0'; assert nexo.encode('hello')"
          .smoke-venv/bin/nexo --help
          printf 'Hello' | .smoke-venv/bin/python -m nexo encode-text | .smoke-venv/bin/python -m nexo decode-text
      - name: Confirm wheel can be rebuilt from sdist
        run: |
          mkdir -p sdist-wheel
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          test -n "$(find sdist-wheel -name '*.whl' -print -quit)"
