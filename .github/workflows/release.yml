# Publish new SDK versions automatically from main; duplicates are skipped.
# No PyPI token secrets; publishing uses short-lived OIDC Trusted Publishing.
# Native PyO3 builds ("nexo-native") require a separate release pipeline.
name: Publish Python SDK

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "python/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      index:
        description: "Select the package index to publish to"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: nexo-python-publishing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate SDK artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.preflight.outputs.should_publish }}
      target: ${{ steps.preflight.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check PyPI index for a new version
        id: preflight
        env:
          PUBLISH_INDEX: ${{ github.event_name == 'push' && 'pypi' || inputs.index }}
        run: python scripts/pypi_preflight.py
      - name: Install build and test tools
        if: steps.preflight.outputs.should_publish == 'true'
        run: python -m pip install --upgrade build twine pytest
      - name: Test source SDK
        if: steps.preflight.outputs.should_publish == 'true'
        run: |
          python -m pip install -e ".[dev,crypto]"
          python -m pytest -q
      - name: Build source distribution and wheel
        if: steps.preflight.outputs.should_publish == 'true'
        run: python -m build
      - name: Check metadata, wheel contents, license and README
        if: steps.preflight.outputs.should_publish == 'true'
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py
      - name: Smoke test the built wheel in a clean environment
        if: steps.preflight.outputs.should_publish == 'true'
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-index --find-links dist nexo-agent-protocol
          .release-smoke/bin/python -c "import importlib.metadata, nexo; assert importlib.metadata.version('nexo-agent-protocol') == nexo.__version__; assert nexo.decode(nexo.encode({'type':'result','task':42})) == {'type':'result','task':42}"
          .release-smoke/bin/nexo --help
      - name: Confirm sdist can build a wheel
        if: steps.preflight.outputs.should_publish == 'true'
        run: |
          mkdir -p sdist-wheels
          python -m pip wheel --no-deps --wheel-dir sdist-wheels dist/*.tar.gz
          test -n "$(find sdist-wheels -name '*.whl' -print -quit)"
      - name: Store validated artifacts
        if: steps.preflight.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexo-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    name: Publish manually to TestPyPI
    if: needs.build.outputs.should_publish == 'true' && github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nexo-agent-protocol/
    permissions:
      id-token: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexo-python-distributions
          path: dist/
      - name: Upload via TestPyPI OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish new versions to PyPI
    if: needs.build.outputs.should_publish == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.index == 'pypi'))
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nexo-agent-protocol/
    permissions:
      id-token: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexo-python-distributions
          path: dist/
      - name: Upload via PyPI OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
