[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "nexo-native"
version = "0.1.0"
requires-python = ">=3.9"
description = "Optional NEXO native Python extension"
license = "LicenseRef-NEXO-NC-ND-1.0"
authors = [{name = "Eduardo J. Barrios"}]

[tool.maturin]
manifest-path = "../crates/nexo-python/Cargo.toml"
module-name = "nexo_native"
