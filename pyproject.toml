[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo"
version = "0.1.0"
description = "Agent-first reversible compact messages with a Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-NEXO-NC-ND-1.0"
license-files = ["LICENSE"]
authors = [{name = "Eduardo J. Barrios"}]
keywords = ["agents", "llm", "serialization", "token-efficiency"]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nexo = "nexo.__main__:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
